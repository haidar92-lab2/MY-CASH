<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>لوحة الأدمن — أكواد التفعيل</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="brand">
  <div class="brand-mark">A</div>
  <div>
    <div class="brand-name">لوحة الأدمن</div>
    <div class="brand-sub">توليد وإدارة أكواد التفعيل</div>
  </div>
</div>

<section class="screen active">
  <div class="card">
    <div class="title">كلمة مرور الأدمن</div>
    <div class="subtitle">هذي الصفحة خاصة فيك بس. لا تشارك الرابط مع أحد.</div>
    <label>كلمة المرور</label>
    <input type="password" id="admin-pass" placeholder="•••••••" />
    <div class="error-text" id="admin-error"></div>
    <div style="height:6px"></div>
    <button class="btn btn-primary" id="btn-admin-login">دخول</button>
  </div>
</section>

<section id="screen-generate" class="screen">
  <div class="card">
    <div class="title">توليد كود تفعيل جديد</div>
    <label>مدة الاشتراك</label>
    <select id="plan-select" style="width:100%; background:var(--surface-2); color:var(--text); border:1px solid var(--border); border-radius:10px; padding:14px; font-family:'Cairo',sans-serif; font-size:16px;">
      <option value="1m">شهر واحد — 10,000 د.ع</option>
      <option value="3m">3 أشهر — 25,000 د.ع</option>
      <option value="12m">سنة كاملة — 90,000 د.ع</option>
    </select>
    <div style="height:10px"></div>
    <button class="btn btn-primary" id="btn-generate">توليد كود جديد</button>
    <div id="generated-result" class="hint-box" style="display:none; margin-top:12px;"></div>
  </div>
  <div class="center-note">أعطي الكود الناتج للوكيل بعد ما يدفع الاشتراك عبر الاتصال أو واتساب.</div>
</section>

<script type="module">
  import { createActivationCode } from './js/db.js';

  const ADMIN_PASSWORD = "غيّرني123";

  document.getElementById('btn-admin-login').addEventListener('click', () => {
    const pass = document.getElementById('admin-pass').value;
    const err = document.getElementById('admin-error');
    if (pass !== ADMIN_PASSWORD) {
      err.textContent = 'كلمة المرور غير صحيحة';
      err.classList.add('show');
      return;
    }
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('screen-generate').classList.add('active');
  });

  function randomCode() {
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let code = '';
    for (let i = 0; i < 6; i++) code += chars[Math.floor(Math.random() * chars.length)];
    return code;
  }

  document.getElementById('btn-generate').addEventListener('click', async () => {
    const plan = document.getElementById('plan-select').value;
    const code = randomCode();
    const btn = document.getElementById('btn-generate');
    btn.disabled = true; btn.textContent = 'جاري التوليد...';
    try {
      await createActivationCode(code, plan);
      const box = document.getElementById('generated-result');
      box.style.display = 'block';
      box.innerHTML = 'الكود الجديد: <span class="hint-phone">' + code + '</span>';
    } catch (e) {
      alert('رسالة الخطأ الحقيقية: ' + (e && e.message ? e.message : JSON.stringify(e)));
    } finally {
      btn.disabled = false; btn.textContent = 'توليد كود جديد';
    }
  });
</script>
</body>
</html>
